[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "adv_mla_at2_experiments"
version = "0.0.1"
description = "Weather intelligence models for Sydney (CCI and WHC)"
authors = [
  { name = "Nishaanth_Govindaraj" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "jupyterlab==4.6.1",
    "matplotlib>=3.11.2",
    "my-krml-26044382==0.0.4",
    "optuna==4.9.0",
    "pandas==2.2.2",
    "pip",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "scikit-learn==1.6.1",
    "xgboost==3.3.0",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["adv_mla_at2_experiments"]
include = ["pyproject.toml", "adv_mla_at2_experiments/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["adv_mla_at2_experiments"]
force-sort-within-sections = true


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
my-krml-26044382 = { index = "testpypi" }
